# Releases @cavelon/cli to npm, through npm's trusted publishing (OIDC): no token
# is stored anywhere. npm accepts this workflow only as goodguys-gmbh/cavelon-dev-kit,
# release.yml, environment "release", and only to *stage* a version. A maintainer
# then approves the staged version on npmjs.com with 2FA before it is public.
#
# After staging, it builds the standalone executables on each platform (signed
# when signing is configured), attests them, and creates the GitHub
# release with the executables, checksums.txt and the install scripts. Then it
# publishes the PyPI wheels, updates the Homebrew tap (when HOMEBREW_TAP_TOKEN
# is set) and writes the winget manifest for submission. Beside them it renders
# the plugin packages for Cursor, VS Code, Kiro and Gemini CLI and attaches
# them to the release. RELEASING.md lists the signing setup and secrets.
#
# A release starts with a tag `vX.Y.Z` matching cli/package.json. Only repository
# admins may create `v*` tags (ruleset "Release tags: admins only"), and the
# "release" environment accepts only `v*` tags.
#
# PyPI (`cavelon`) has a trusted publisher configured for the same workflow and
# environment, also without a token. PyPI has no staging: the `pypi` job's
# upload is public at once, so a pushed tag is the approval there.
name: Release

# Actions are pinned to a commit and no cache is restored: this workflow holds
# an OIDC token that can stage a release, and the signing secrets. Each job gets
# only the permissions it needs.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: verify the tagged CLI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: The tag matches cli/package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "::error::Tag ${GITHUB_REF_NAME} does not match cli/package.json version ${version}"
            exit 1
          }
      # Dependencies' install scripts never run where a release can be staged.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test

  stage-npm:
    name: stage @cavelon/cli on npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm with staged publishing
        run: npm install -g --ignore-scripts npm@11.16.0
      # Dependencies' install scripts never run where a release can be staged.
      - run: npm ci --ignore-scripts
      - name: Stage the package for a maintainer's approval
        run: npm stage publish --access public

  executables:
    name: executable (${{ matrix.asset }})
    needs: stage-npm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # Signing configuration belongs to this environment, which accepts only v* tags.
    environment: release
    permissions:
      contents: read
      id-token: write # short-lived Azure authentication in the protected release environment
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, asset: cavelon-linux-x64 }
          - { os: ubuntu-24.04-arm, asset: cavelon-linux-arm64 }
          - { os: macos-latest, asset: cavelon-darwin-arm64 }
          - { os: macos-15-intel, asset: cavelon-darwin-x64 }
          - { os: windows-latest, asset: cavelon-windows-x64.exe }
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: cli/.bun-version
          no-cache: true
      # Dependencies' install scripts never run where a release is built.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run build:executable

      # Signing runs only when its secrets are set; until then the executables
      # are released unsigned (docs/installation.md says what that means).
      - name: Resolve signing configuration
        id: signing
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_AUTH: ${{ vars.AZURE_SIGNING_AUTH }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERTIFICATE_PROFILE: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
        run: node ../.github/scripts/signing-config.mjs
      - name: Sign (macOS, Developer ID, hardened runtime)
        if: steps.signing.outputs.macos == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          ASSET: ${{ matrix.asset }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          codesign --force --sign "$MACOS_SIGNING_IDENTITY" --keychain "$keychain" --options runtime --timestamp \
            --entitlements ../packaging/macos/entitlements.plist "build/$ASSET"
          codesign --verify --strict --verbose=2 "build/$ASSET"
      - name: Notarise (macOS)
        if: steps.signing.outputs.notarize == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
          ASSET: ${{ matrix.asset }}
        run: |
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          # notarytool takes an archive; a bare executable cannot be stapled, so
          # Gatekeeper looks the ticket up online.
          ditto -c -k --keepParent "build/$ASSET" "$RUNNER_TEMP/$ASSET.zip"
          xcrun notarytool submit "$RUNNER_TEMP/$ASSET.zip" --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait --timeout 30m
          rm -f "$RUNNER_TEMP/notary.p8"
      - name: Remove the signing keychain
        if: always() && steps.signing.outputs.macos == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
      - name: Log in to Azure for Windows signing (OIDC)
        if: steps.signing.outputs.windows_auth == 'oidc'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        env:
          AZURE_CORE_OUTPUT: none
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Sign (Windows, Azure Artifact Signing)
        if: steps.signing.outputs.windows == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ steps.signing.outputs.windows_auth == 'secret' && secrets.AZURE_CLIENT_SECRET || '' }}
          exclude-environment-credential: ${{ steps.signing.outputs.windows_auth == 'oidc' }}
          exclude-azure-cli-credential: ${{ steps.signing.outputs.windows_auth != 'oidc' }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\cli\build\${{ matrix.asset }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: cavelon
          description-url: https://github.com/goodguys-gmbh/cavelon-dev-kit
          cache-dependencies: false
      - name: Check the Windows signature
        if: steps.signing.outputs.windows == 'true'
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature "build/${{ matrix.asset }}"
          $signature | Format-List | Out-String | Write-Host
          if ($signature.Status -ne 'Valid') { exit 1 }

      # The executable as released, run on its platform against the fake server.
      - name: Smoke test the executable (--version, whoami, login, init --agents, MCP)
        shell: bash
        env:
          CAVELON_EXECUTABLE: ${{ github.workspace }}/cli/build/${{ matrix.asset }}
        run: |
          test -f "$CAVELON_EXECUTABLE"
          npm run test:executable
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: cli/build/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  attest:
    name: checksums and provenance
    needs: executables
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Sigstore signs the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cavelon-*
          path: release
          merge-multiple: true
      - name: The release's files and checksums.txt
        run: |
          cp install.sh install.ps1 release/
          cd release
          sha256sum cavelon-* install.sh install.ps1 > checksums.txt
          cat checksums.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: GitHub release
    needs: attest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Create the release, or update its files on a re-run
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          {
            # This version's section of the changelog.
            awk -v v="$version" '
              index($0, "## [" v "]") == 1 { on = 1; next }
              on && /^## \[/ { exit }
              on { print }
            ' CHANGELOG.md
            cat <<NOTES

          ## Install

          macOS and Linux:

          \`\`\`bash
          curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/install.sh | sh -s -- --version ${version}
          \`\`\`

          Windows (PowerShell):

          \`\`\`powershell
          \$env:CAVELON_VERSION = '${version}'; irm https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/install.ps1 | iex
          \`\`\`

          Or with Node.js: \`npx -y @cavelon/cli@${version} --version\`. Every file here is listed in \`checksums.txt\`, and its build provenance can be checked with \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\`.
          NOTES
          } > notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "cavelon ${version}" --notes-file notes.md
          fi

  # ---- Plugin packages --------------------------------------------------------
  # The plugin packages of the clients without a marketplace in this repository
  # (packaging/plugins.mjs), rendered from the tagged plugin/ and attested. Each
  # is its own artifact, plugin-package-<package>, for other jobs to take in;
  # plugin-packages-release attaches them to the release with their checksums.
  plugin-packages:
    name: plugin packages
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Sigstore signs the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Render the packages
        run: node packaging/render.mjs plugins
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packaging-out/plugins/*.tar.gz
      # Cursor, VS Code with GitHub Copilot, Copilot CLI and Kiro.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-package-agent-plugins
          path: packaging-out/plugins/cavelon-agent-plugin*.tar.gz
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-package-gemini
          path: packaging-out/plugins/*.cavelon-gemini-extension.tar.gz
          if-no-files-found: error
          retention-days: 7
      # Claude Code and Codex, for a machine that cannot reach GitHub.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-package-marketplace
          path: packaging-out/plugins/cavelon-marketplace.tar.gz
          if-no-files-found: error
          retention-days: 7

  plugin-packages-release:
    name: attach the plugin packages
    needs: [github-release, plugin-packages]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # upload the release's files
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: plugin-package-*
          path: packages
          merge-multiple: true
      # `gemini extensions install <this repository>` takes the asset whose name starts with its platform.
      - name: Upload them with checksums-plugins.txt (a re-run replaces them)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd packages
          sha256sum -- *.tar.gz > checksums-plugins.txt
          cat checksums-plugins.txt
          gh release upload "$TAG" ./*.tar.gz checksums-plugins.txt --repo "$GITHUB_REPOSITORY" --clobber
  # ---- end of plugin packages ---------------------------------------------------

  # The wheels carry the executables the GitHub release published, so they wait
  # for it: an upload to PyPI cannot be replaced, and a failed release before it
  # publishes nothing there.
  pypi:
    name: PyPI
    needs: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PyPI's trusted publisher accepts only this workflow in this environment.
    environment: release
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing (OIDC) and the uploads' attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Build the wheels from the attested executables
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 -I packaging/pypi/build_wheels.py release "${TAG#v}" dist
          ls -l dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          attestations: true

  # --- offline bundle (docs/offline-bundle.md) ---------------------------------
  # cavelon-bundle-<version>.tar.gz for machines that reach neither GitHub, npm
  # nor PyPI: the released executables, the plugin with an MCP entry that starts
  # the cavelon on the PATH, the skills, and the plugin packages for the other
  # clients. The builder renders those itself with that MCP entry (render.mjs
  # plugins --server installed): the plugin-package-* artifacts fall back to npx,
  # which has no registry offline. It waits for plugin-packages all the same,
  # so a release whose packages failed gets no bundle. The bundle and its
  # manifest are signed keylessly with Sigstore (cosign sign-blob, bundle
  # format) as this workflow, so no signing secret exists, and both are added to
  # the release the github-release job created. A re-run replaces them.
  offline-bundle:
    name: offline bundle, signed with Sigstore
    needs: [github-release, plugin-packages]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # add the bundle and its signatures to the release
      id-token: write # Sigstore keyless signing and the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The bundle's manifest names the contract versions cli/dist/version.js
      # understands. Dependencies' install scripts never run where a release is built.
      - name: Build the CLI for its supported contract versions
        working-directory: cli
        run: |
          npm ci --ignore-scripts
          npm run build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Build the bundle
        id: bundle
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node packaging/bundle/build-bundle.mjs --executables release --commit "$GITHUB_SHA"
          echo "name=cavelon-bundle-${TAG#v}" >> "$GITHUB_OUTPUT"
          ls -l packaging-out/bundle
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the bundle and its manifest, and verify them as a user would
        env:
          NAME: ${{ steps.bundle.outputs.name }}
        run: |
          cd packaging-out/bundle
          # Only GitHub's OIDC token: without --oidc-provider a failed token fetch
          # falls back to a browser device flow nobody can answer here, which
          # waits out five minutes and fails the release (#344). A failed
          # attempt is retried instead.
          sign() {
            for attempt in 1 2 3; do
              timeout 120 cosign sign-blob --yes --oidc-provider github-actions --bundle "$1.sigstore.json" "$1" && return 0
              echo "::warning::Signing $1 failed (attempt $attempt of 3)"
              sleep "$((attempt * ${SIGN_RETRY_SECONDS:-10}))"
            done
            return 1
          }
          for file in "$NAME.tar.gz" "$NAME.manifest.json"; do
            sign "$file"
            cosign verify-blob --bundle "$file.sigstore.json" \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$file"
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            packaging-out/bundle/${{ steps.bundle.outputs.name }}.tar.gz
            packaging-out/bundle/${{ steps.bundle.outputs.name }}.manifest.json
      - name: Add them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" packaging-out/bundle/* --repo "$GITHUB_REPOSITORY" --clobber
  # --- end of the offline bundle ---------------------------------------------------

  homebrew:
    name: Homebrew tap
    needs: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # HOMEBREW_TAP_TOKEN is a secret of this environment: a token that may push
    # to goodguys-gmbh/homebrew-cavelon and nothing else.
    environment: release
    permissions:
      contents: read
    steps:
      - name: Is the tap set up
        id: tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$HOMEBREW_TAP_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; the Homebrew tap was not updated (RELEASING.md)."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.tap.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.tap.outputs.ready == 'true'
        with:
          name: release
          path: release
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.tap.outputs.ready == 'true'
        with:
          repository: goodguys-gmbh/homebrew-cavelon
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Update the formula
        if: steps.tap.outputs.ready == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node packaging/render.mjs homebrew
          mkdir -p tap/Formula && cp packaging-out/homebrew/Formula/cavelon.rb tap/Formula/
          cd tap
          git add Formula/cavelon.rb
          if git diff --cached --quiet; then echo "The formula is up to date."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "cavelon ${TAG#v}"
          git push

  winget:
    name: winget manifest
    needs: github-release
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Write the manifest
        shell: powershell
        run: |
          node packaging/render.mjs winget
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content cli/package.json | ConvertFrom-Json).version
          $manifest = "packaging-out/winget/manifests/g/goodguys/Cavelon/$version"
          $sha = (Get-FileHash release/cavelon-windows-x64.exe -Algorithm SHA256).Hash
          .github/scripts/test-winget.ps1 -ManifestDir $manifest -Version $version -Sha256 $sha
          Write-Host '::notice::The validated winget manifest is in artifact winget-manifest; RELEASING.md says how to submit it.'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: winget-native-evidence
          path: ${{ runner.temp }}/cavelon-winget-*/evidence.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: winget-manifest
          path: packaging-out/winget/
          if-no-files-found: error
