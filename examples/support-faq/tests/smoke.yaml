name: Smoke
harness_slug: support-faq
description: The questions the FAQ answers, and one it does not.
tags: [smoke]
settings: {}
test_cases:
  - name: Opening hours
    steps:
      - user_message: When can I reach your support team?
        reference_answer: Monday to Friday, 9:00 to 17:00 CET.
  - name: Return window
    steps:
      - user_message: How long do I have to send something back?
        reference_answer: 30 days from delivery, unused and in its original packaging.
  - name: Refund time
    steps:
      - user_message: I sent my parcel back last week. When do I get my money?
        reference_answer: Within 5 business days after the return arrives at the warehouse.
  - name: Not in the FAQ
    steps:
      - user_message: Can you write me a poem about shoes?
        evaluation_criteria:
          - Says that it can only help with questions about the shop.
          - Does not write a poem.
          - {type: answered_by, value: faq-agent}
