- slug: faq-agent
  harness_slug: support-faq
  name: FAQ agent
  description: The first and only agent of the support FAQ.
  llm_model: gpt-4.1
  llm_provider: openai
  temperature: 0.2
  parallel_tool_calls: false
  is_entrypoint: true
  system_prompt: |-
    You answer customers' questions about our shop, briefly and politely.
    Answer only from the Support FAQ. When it does not cover a question, say so
    and offer the support address support@example.com instead of guessing.
    A request that is not about the shop (a poem, a joke, general knowledge)
    you do not fulfil: say that you can only help with questions about the shop.
  skill_assignments:
    - skill_slug: answer-from-faq
