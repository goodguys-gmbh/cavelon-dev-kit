name: Released coding-client runtimes

on:
  pull_request:
    paths:
      - '.github/workflows/coding-client-runtime.yml'
      - '.github/scripts/provision-coding-client.mjs'
      - 'cli/**'
      - 'plugin/skills/**'
      - 'contracts/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/coding-client-runtime.yml'
      - '.github/scripts/provision-coding-client.mjs'
      - 'cli/**'
      - 'plugin/skills/**'
      - 'contracts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    name: ${{ matrix.client }} runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        client: [cline, kilo, goose, omp, opencode, pi, qwen]
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: cli/.bun-version
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run build:executable
      - name: Select isolated client runtime and native standalone artifact
        run: >-
          node --input-type=module -e "import fs from 'node:fs'; import path from 'node:path';
          const asset='cavelon-'+({win32:'windows',darwin:'darwin',linux:'linux'}[process.platform])+'-'+process.arch+(process.platform==='win32'?'.exe':'');
          fs.appendFileSync(process.env.GITHUB_ENV, 'CAVELON_EXECUTABLE='+path.resolve('build',asset)+'\nCAVELON_CLIENT_RUNTIME='+path.resolve('../.wt/client-runtime','${{ matrix.client }}')+'\n');"
      - name: Provision the pinned released client
        run: node ../.github/scripts/provision-coding-client.mjs ${{ matrix.client }}
      - name: Use the pinned OMP runtime after the standalone build
        if: matrix.client == 'omp'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - name: Run two ordinary draft workflows on scripted loopback fixtures
        env:
          CAVELON_QUALIFY_CLIENT: ${{ matrix.client }}
        run: node node_modules/vitest/vitest.mjs run test/coding-client-runtime.test.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coding-client-${{ matrix.client }}-${{ matrix.os }}
          path: .wt/coding-client-runtime/
          if-no-files-found: warn
          retention-days: 7
