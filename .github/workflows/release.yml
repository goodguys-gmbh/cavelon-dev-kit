# Releases @cavelon/cli to npm, through npm's trusted publishing (OIDC): no token
# is stored anywhere. npm accepts this workflow only as goodguys-gmbh/cavelon-dev-kit,
# release.yml, environment "release", and only to *stage* a version. A maintainer
# then approves the staged version on npmjs.com with 2FA before it is public.
#
# After staging, it builds the standalone executables on each platform (signed
# when the signing secrets are set), attests them, and creates the GitHub
# release with the executables, checksums.txt and the install scripts. Then it
# updates the Homebrew tap (when HOMEBREW_TAP_TOKEN is set) and writes the
# winget manifest for submission. RELEASING.md lists the secrets.
#
# A release starts with a tag `vX.Y.Z` matching cli/package.json. Only repository
# admins may create `v*` tags (ruleset "Release tags: admins only"), and the
# "release" environment accepts only `v*` tags.
#
# PyPI (`cavelon`) has a trusted publisher configured for the same workflow and
# environment; its job is added with the Python package.
name: Release

# Actions are pinned to a commit and no cache is restored: this workflow holds
# an OIDC token that can stage a release, and the signing secrets. Each job gets
# only the permissions it needs.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: verify the tagged CLI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: The tag matches cli/package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "::error::Tag ${GITHUB_REF_NAME} does not match cli/package.json version ${version}"
            exit 1
          }
      # Dependencies' install scripts never run where a release can be staged.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  stage-npm:
    name: stage @cavelon/cli on npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm with staged publishing
        run: npm install -g --ignore-scripts npm@11.16.0
      # Dependencies' install scripts never run where a release can be staged.
      - run: npm ci --ignore-scripts
      - name: Stage the package for a maintainer's approval
        run: npm stage publish --access public

  executables:
    name: executable (${{ matrix.asset }})
    needs: stage-npm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # The signing secrets are secrets of this environment, which accepts only v* tags.
    environment: release
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, asset: cavelon-linux-x64 }
          - { os: ubuntu-24.04-arm, asset: cavelon-linux-arm64 }
          - { os: macos-latest, asset: cavelon-darwin-arm64 }
          - { os: macos-15-intel, asset: cavelon-darwin-x64 }
          - { os: windows-latest, asset: cavelon-windows-x64.exe }
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: cli/.bun-version
          no-cache: true
      # Dependencies' install scripts never run where a release is built.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run build:executable

      # Signing runs only when its secrets are set; until then the executables
      # are released unsigned (docs/installation.md says what that means).
      - name: Which signing secrets are set
        id: signing
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          {
            echo "macos=$([ "$RUNNER_OS" = macOS ] && [ -n "$MACOS_CERTIFICATE_P12" ] && echo true || echo false)"
            echo "notarize=$([ "$RUNNER_OS" = macOS ] && [ -n "$MACOS_CERTIFICATE_P12" ] && [ -n "$APPLE_API_KEY_P8" ] && echo true || echo false)"
            echo "windows=$([ "$RUNNER_OS" = Windows ] && [ -n "$AZURE_CLIENT_SECRET" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
      - name: Sign (macOS, Developer ID, hardened runtime)
        if: steps.signing.outputs.macos == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          ASSET: ${{ matrix.asset }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          codesign --force --sign "$MACOS_SIGNING_IDENTITY" --keychain "$keychain" --options runtime --timestamp \
            --entitlements ../packaging/macos/entitlements.plist "build/$ASSET"
          codesign --verify --strict --verbose=2 "build/$ASSET"
      - name: Notarise (macOS)
        if: steps.signing.outputs.notarize == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
          ASSET: ${{ matrix.asset }}
        run: |
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          # notarytool takes an archive; a bare executable cannot be stapled, so
          # Gatekeeper looks the ticket up online.
          ditto -c -k --keepParent "build/$ASSET" "$RUNNER_TEMP/$ASSET.zip"
          xcrun notarytool submit "$RUNNER_TEMP/$ASSET.zip" --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait --timeout 30m
          rm -f "$RUNNER_TEMP/notary.p8"
      - name: Remove the signing keychain
        if: always() && steps.signing.outputs.macos == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
      - name: Sign (Windows, Azure Artifact Signing)
        if: steps.signing.outputs.windows == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\cli\build\${{ matrix.asset }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: cavelon
          description-url: https://github.com/goodguys-gmbh/cavelon-dev-kit
          cache-dependencies: false
      - name: Check the Windows signature
        if: steps.signing.outputs.windows == 'true'
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature "build/${{ matrix.asset }}"
          $signature | Format-List | Out-String | Write-Host
          if ($signature.Status -ne 'Valid') { exit 1 }

      # The executable as released, run on its platform against the fake server.
      - name: Smoke test the executable (--version, whoami, login, init --agents, MCP)
        shell: bash
        env:
          CAVELON_EXECUTABLE: ${{ github.workspace }}/cli/build/${{ matrix.asset }}
        run: |
          test -f "$CAVELON_EXECUTABLE"
          npx vitest run test/executable.test.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: cli/build/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  attest:
    name: checksums and provenance
    needs: executables
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Sigstore signs the attestation
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cavelon-*
          path: release
          merge-multiple: true
      - name: The release's files and checksums.txt
        run: |
          cp install.sh install.ps1 release/
          cd release
          sha256sum cavelon-* install.sh install.ps1 > checksums.txt
          cat checksums.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: GitHub release
    needs: attest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its files
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      - name: Create the release, or update its files on a re-run
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          {
            # This version's section of the changelog.
            awk -v v="$version" '
              index($0, "## [" v "]") == 1 { on = 1; next }
              on && /^## \[/ { exit }
              on { print }
            ' CHANGELOG.md
            cat <<NOTES

          ## Install

          macOS and Linux:

          \`\`\`bash
          curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/install.sh | sh -s -- --version ${version}
          \`\`\`

          Windows (PowerShell):

          \`\`\`powershell
          \$env:CAVELON_VERSION = '${version}'; irm https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/install.ps1 | iex
          \`\`\`

          Or with Node.js: \`npx -y @cavelon/cli@${version} --version\`. Every file here is listed in \`checksums.txt\`, and its build provenance can be checked with \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\`.
          NOTES
          } > notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "cavelon ${version}" --notes-file notes.md
          fi

  homebrew:
    name: Homebrew tap
    needs: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # HOMEBREW_TAP_TOKEN is a secret of this environment: a token that may push
    # to goodguys-gmbh/homebrew-cavelon and nothing else.
    environment: release
    permissions:
      contents: read
    steps:
      - name: Is the tap set up
        id: tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$HOMEBREW_TAP_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; the Homebrew tap was not updated (RELEASING.md)."
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.tap.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.tap.outputs.ready == 'true'
        with:
          name: release
          path: release
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.tap.outputs.ready == 'true'
        with:
          repository: goodguys-gmbh/homebrew-cavelon
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Update the formula
        if: steps.tap.outputs.ready == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node packaging/render.mjs homebrew --version "${TAG#v}" --checksums release/checksums.txt --out tap
          cd tap
          git add Formula/cavelon.rb
          if git diff --cached --quiet; then echo "The formula is up to date."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "cavelon ${TAG#v}"
          git push

  winget:
    name: winget manifest
    needs: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      - name: Write the manifest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node packaging/render.mjs winget --version "${TAG#v}" --checksums release/checksums.txt --out winget
          echo "::notice::The winget manifest is in this run's artifact winget-manifest; RELEASING.md says how to submit it."
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: winget-manifest
          path: winget/
          if-no-files-found: error
