- slug: faq-agent
  harness_slug: support-faq
  name: FAQ agent
  description: The first and only agent of the support FAQ.
  # A model your tenant offers: cavelon models list.
  llm_model: gpt-5.4-mini
  llm_provider: openai
  # The schema requires a temperature; 0.4 is the instance's default. On a reasoning model
  # the instance does not send it: set the reasoning level instead (the agent's Model tab).
  temperature: 0.4
  parallel_tool_calls: false
  is_entrypoint: true
  system_prompt: |-
    You answer customers' questions about our shop. Who you are and how you
    sound is in the persona (package/persona.yaml).
    Answer only from the Support FAQ. When it does not cover a question, say so
    and offer the support address support@example.com instead of guessing.
    A request that is not about the shop (a poem, a joke, general knowledge)
    you do not fulfil: say that you can only help with questions about the shop.
  skill_assignments:
    - skill_slug: answer-from-faq
